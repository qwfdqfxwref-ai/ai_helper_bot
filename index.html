<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Helper</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      padding-bottom: 80px;
      background: #ffffff;
      color: #222;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
    }

    #chat {
      margin-top: 30px;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #2481cc;
      color: white;
    }

    .bot {
      background: #eeeeee;
    }

    form {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: white;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #2481cc;
      color: white;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>🤖 AI Helper</h1>

<div id="chat">
  <div class="message bot">
    Привіт! Я AI-помічник 🤖
  </div>
</div>

<form id="form">
  <input
    id="input"
    placeholder="Напиши повідомлення..."
    autocomplete="off"
  >

  <button type="submit">➤</button>
</form>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const form = document.getElementById("form");
const input = document.getElementById("input");
const chat = document.getElementById("chat");

function addMessage(text, type) {
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  window.scrollTo(0, document.body.scrollHeight);

  return message;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const thinking = addMessage("Думаю... 🤔", "bot");

  try {
    const response = await fetch(
      "https://serving-charleston-trademark-impose.trycloudflare.com/api/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text,
          user_id: tg.initDataUnsafe?.user?.id || null
        })
      }
    );

    if (!response.ok) {
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    thinking.textContent =
      data.answer || "AI не повернув відповідь.";

  } catch (error) {
    console.error(error);

    thinking.textContent =
      "Не вдалося підключитися до AI-сервера 😕";
  }
});
</script>

</body>
</html>
